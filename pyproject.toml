[project]
name = "nonebot-plugin-aawarframe"
version = "0.5.1"
description = "aa 的 Warframe 助手"
authors = [
    {name = "nekox41",email = "aameow@outlook.com"},
]
dependencies = ["nonebot2>=2.5.0", "httpx>=0.28.1",  "nonebot-adapter-onebot>=2.4.6", "nonebot-plugin-htmlrender>=0.8.0", "playwright>=1.61.0"]
requires-python = "==3.12.*"
readme = "README.md"
