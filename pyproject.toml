[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-aawarframe"
version = "0.24.1"
description = "Aa 的 Warframe 助手：单包支持 QQ 官方和 OneBot V11"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [{name = "nekox41", email = "aameow@outlook.com"}]
dependencies = [
  "nonebot2>=2.5.0",
  "httpx>=0.28.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  "curl-cffi>=0.17,<0.18",
  "nonebot-plugin-htmlrender>=0.8.0,<0.9",
  "playwright>=1.61.0",
  "rapidfuzz>=3.14.5",
  "pydantic>=2,<3",
  "jinja2>=3.1",
  "json5>=0.9.25",
]
[project.optional-dependencies]
qq = ["nonebot-adapter-qq>=1.7.4,<2"]
onebot = ["nonebot-adapter-onebot>=2.4.6,<3"]
ocr = ["paddlepaddle==3.2.0", "paddleocr==3.3.2", "Pillow>=11,<13"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "build>=1", "twine>=6"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "core"

[tool.setuptools.packages.find]
where = ["core"]
include = ["nonebot_plugin_aawarframe*", "nonebot_plugin_aawfcore*"]

[tool.setuptools.package-data]
nonebot_plugin_aawfcore = [
  "assets/offline.tar.gz", "assets/riven_stats.json",
  "rendering/templates/*.html", "rendering/assets/css/*.css",
  "rendering/assets/css/themes/*.css", "admin/static/*"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
