[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-aawarframe"
version = "0.6.8"
description = "aa 的 Warframe 助手"
authors = [
    {name = "nekox41",email = "aameow@outlook.com"},
]
dependencies = [
    "nonebot2>=2.5.0",
    "httpx>=0.28.1",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-htmlrender>=0.8.0,<0.9",
    "playwright>=1.61.0",
    "rapidfuzz>=3.14.5",
    "pydantic>=2.0,<3",
    "jinja2>=3.1",
    "json5>=0.9.25",
]
requires-python = "==3.12.*"
readme = "README.md"
license = "MIT"

[tool.setuptools.packages.find]
where = ["."]
include = ["nonebot_plugin_aawarframe*"]

[tool.setuptools.package-data]
nonebot_plugin_aawarframe = ["assets/**/*.json", "rendering/templates/*.html", "rendering/assets/css/*.css"]


[tool.pdm]
distribution = false

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "build>=1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
