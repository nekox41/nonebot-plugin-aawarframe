
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src 'none'; img-src data:">
  <title>{{ card.title }}</title>
</head>
<body class="{% if card.source == 'AAWarframe · 订阅提醒' %}subscription-page {% endif %}{% if card.analysis_mode or card.parts_board or card.relic_board or card.trend_board or card.attribute_rows or card.riven_market_board or card.command_names or card.riven_values_board or card.trader_board or card.arbitration_board or card.market_board or card.fissure_mode or card.cycle_items or card.bounty_mode or card.archimedea_mode or card.nightwave_mode or card.weekly_mode or card.operation_board %}compact-page {% endif %}{% if card.analysis_mode %}analysis-page{% elif card.parts_board or card.relic_board %}relic-page{% elif card.trend_board %}trend-page{% elif card.attribute_rows %}attributes-page{% elif card.riven_market_board %}riven-market-page{% elif card.command_names %}commands-page{% elif card.riven_values_board %}riven-values-page{% elif card.trader_board %}trader-page{% elif card.arbitration_board %}arbitration-page{% elif card.market_board %}market-page{% elif card.operation_board %}operation-page{% elif card.weekly_mode %}weekly-page{% elif card.nightwave_mode %}nightwave-page{% elif card.archimedea_mode %}archimedea-page{% elif card.fissure_mode %}fissure-page{% elif card.cycle_items %}cycle-page{% elif card.bounty_mode %}bounty-page{% endif %}">
<main class="card{% if card.fissure_mode %} card--fissures{% endif %}">
  
  <div class="card__content">
  {% if card.stale %}<p class="notice notice--warning">暂未更新，当前显示上次记录。</p>{% endif %}
  
<div class="command-grid">
{% for name in card.command_names %}<div class="command-name">{{ name }}</div>{% endfor %}
</div>

  {% if card.notes %}<aside class="notes">{% for note in card.notes %}<p class="note">{{ note }}</p>{% endfor %}</aside>{% endif %}
  </div>
  <footer class="card__footer command-footer"><strong class="signature">By. Aameow</strong></footer>
</main>
</body>
</html>
