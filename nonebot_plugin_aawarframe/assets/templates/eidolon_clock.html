<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 800px;
            background: linear-gradient(135deg, #fff0f5, #ffe4f0, #f8e1f0);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
                         "Noto Sans CJK SC", "Hiragino Sans GB", "WenQuanYi Micro Hei", sans-serif;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
        }

        /* 大量静态樱花花瓣装饰 */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 182, 193, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 78% 22%, rgba(255, 105, 180, 0.28) 0%, transparent 50%),
                radial-gradient(circle at 25% 45%, rgba(255, 200, 220, 0.32) 0%, transparent 40%),
                radial-gradient(circle at 85% 55%, rgba(255, 160, 190, 0.25) 0%, transparent 48%),
                radial-gradient(circle at 18% 72%, rgba(255, 182, 193, 0.30) 0%, transparent 45%),
                radial-gradient(circle at 70% 82%, rgba(255, 105, 180, 0.22) 0%, transparent 50%);
        }

        body::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 35% 12%, rgba(255, 220, 230, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 65% 28%, rgba(255, 140, 180, 0.20) 0%, transparent 45%),
                radial-gradient(circle at 48% 88%, rgba(255, 182, 193, 0.28) 0%, transparent 42%);
            opacity: 0.85;
        }

        .container {
            width: 90%;                 /* 铺满 body 的 90% */
            background: linear-gradient(145deg, #fff5f8, #ffe9f0, #ffe0eb);
            border-radius: 40px;
            overflow: hidden;
            box-shadow:
                0 30px 70px -15px rgba(255, 105, 180, 0.4),
                0 0 0 1px rgba(255, 182, 193, 0.5) inset,
                0 15px 40px rgba(255, 140, 170, 0.25);
            border: 3px solid rgba(255, 182, 193, 0.65);
            position: relative;
            z-index: 1;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        td, th {
            padding: 22px 30px;
            text-align: center;
            border: none;
        }

        /* 当前状态 */
        .state {
            background: linear-gradient(to right, #ffb3c6, #ff8fab);
            font-size: 1.65rem;
            font-weight: 600;
            color: #5c2a3a;
            letter-spacing: 2.5px;
            padding: 28px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* 剩余时间 */
        .rest {
            background: linear-gradient(to right, #ffe4f0, #ffd1e6);
            font-size: 2.35rem;
            font-weight: 600;
            color: #d14a7e;
            padding: 34px 30px;
            letter-spacing: 1px;
            text-shadow: 0 3px 15px rgba(255, 105, 180, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.75);
        }

        /* 标题 */
        .title {
            background: #fff0f7;
            font-size: 1.2rem;
            font-weight: 600;
            color: #e06a9a;
            letter-spacing: 4px;
            padding: 18px 30px 16px;
            border-bottom: 1px solid rgba(255, 182, 193, 0.45);
        }

        /* 时间行 */
        .time {
            background: rgba(255, 245, 250, 0.93);
            font-size: 1.9rem;
            font-family: ui-monospace, "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
            font-weight: 500;
            color: #c05a8a;
            padding: 22px 30px;
            letter-spacing: 5px;
        }

        tr:last-child .time {
            border-bottom-left-radius: 36px;
            border-bottom-right-radius: 36px;
        }

        /* 分隔线 */
        td:not(:last-child) {
            border-bottom: 1px solid rgba(255, 182, 193, 0.38);
        }

        /* 额外樱花装饰 */
        .container::before {
            content: '🌸';
            position: absolute;
            font-size: 48px;
            opacity: 0.12;
            top: 40px;
            left: 40px;
            z-index: 0;
        }

        .container::after {
            content: '🌸';
            position: absolute;
            font-size: 64px;
            opacity: 0.1;
            top: 100px;
            right: 40px;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <table>
            <tr>
                <td class="state">当前状态：{{CURRENT_STATE}}</td>
            </tr>
            <tr>
                <td class="rest">剩余时间：{{REMAINING_TIME}}</td>
            </tr>
            <tr>
                <td class="title">即将到来的黑夜</td>
            </tr>
            {{NIGHT_TIMES_ROWS}}
        </table>
    </div>
</body>
</html>
