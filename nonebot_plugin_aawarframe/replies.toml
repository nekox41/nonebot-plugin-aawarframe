COMMAND_ENVELOPE = [{ type = "content", name = "CONTENT" }]
SUB_NOTIFICATION = [{ type = "at", target = "%USER_ID%" }, { type = "image", name = "IMAGE", optional = true }, { type = "text", key = "SUB_NOTIFICATION_FALLBACK", when = "FALLBACK" }]
