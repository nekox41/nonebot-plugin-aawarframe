name: Subscription MVP

on:
  pull_request:
    paths:
      - "nonebot_plugin_aawarframe/subscriptions/**"
      - "nonebot_plugin_aawarframe/bootstrap.py"
      - "nonebot_plugin_aawarframe/commands/router.py"
      - "tests/test_subscriptions.py"
      - "tests/test_subscription_extensions.py"
  workflow_dispatch:

jobs:
  subscription-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plugin and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile source
        run: python -m compileall -q nonebot_plugin_aawarframe
      - name: Verify subscription MVP
        run: python -m pytest -q tests/test_subscriptions.py tests/test_subscription_extensions.py
