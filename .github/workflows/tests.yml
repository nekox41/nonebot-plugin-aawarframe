name: Tests

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check nonebot_plugin_aawarframe tests
      - run: ruff format --check nonebot_plugin_aawarframe tests
      - run: python -m pytest -q
      - run: python -m build
