name: QQ Official Adapter

on:
  pull_request:
    paths:
      - "nonebot_plugin_aawarframe/protocols/**"
      - "nonebot_plugin_aawarframe/commands/router.py"
      - "nonebot_plugin_aawarframe/subscriptions/service.py"
      - "nonebot_plugin_aawarframe/admin/control.py"
      - "nonebot_plugin_aawarframe/__init__.py"
      - "tests/test_qq_official.py"
      - ".github/workflows/qq-official-ci.yml"
      - "pyproject.toml"
      - "distributions/**"
      - "examples/**"
      - "tests/test_protocol_messages.py"
  workflow_dispatch:

jobs:
  qq-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QQ adapter without OneBot
        run: python -m pip install -e '.[dev,qq]'
      - name: Verify QQ-only runtime really has no OneBot dependency
        run: |
          python - <<'PY'
          from importlib.util import find_spec
          assert find_spec("nonebot.adapters.onebot") is None, "OneBot was installed unexpectedly"
          import nonebot
          nonebot.init(driver="~none", render={"provider":"playwright","startup":"off"})
          from nonebot_plugin_aawarframe.protocols.message import Message, MessageSegment
          assert Message(MessageSegment.text("ok")).extract_plain_text() == "ok"
          loaded = nonebot.load_plugin("nonebot_plugin_aawarframe")
          assert loaded is not None, "The shared core failed to load with QQ-only dependencies"
          print("QQ-only startup works without any OneBot installation")
          PY
      - name: Install OneBot separately for legacy compatibility tests
        run: python -m pip install -e '.[onebot]'
      - name: Check independent distribution wheels
        run: |
          python -m build --wheel distributions/qq --outdir dist/qq
          python -m build --wheel distributions/onebot --outdir dist/onebot
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for package, entry in (
              ("qq", "nonebot_plugin_aawfqq/__init__.py"),
              ("onebot", "nonebot_plugin_aawfonebot/__init__.py"),
          ):
              wheel = next((Path("dist")/package).glob("*.whl"))
              with ZipFile(wheel) as archive:
                  assert entry in archive.namelist(), (package, archive.namelist())
          print("Both standalone plugin entrypoint wheels contain their entrypoints")
          PY
      - name: Compile source
        run: python -m compileall -q nonebot_plugin_aawarframe
      - name: Lint modified adapter code
        run: python -m ruff check nonebot_plugin_aawarframe/protocols nonebot_plugin_aawarframe/commands/router.py nonebot_plugin_aawarframe/subscriptions/service.py nonebot_plugin_aawarframe/admin/control.py tests/test_qq_official.py tests/test_protocol_messages.py distributions/qq distributions/onebot
      - name: Official QQ adapter tests
        run: python -m pytest -q tests/test_qq_official.py tests/test_message_output.py tests/test_protocol_messages.py
      - name: Full regression suite
        run: python -m pytest -q
