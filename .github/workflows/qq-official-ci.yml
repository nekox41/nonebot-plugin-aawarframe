name: QQ Official Adapter

on:
  pull_request:
    paths:
      - "nonebot_plugin_aawarframe/protocols/**"
      - "nonebot_plugin_aawarframe/commands/router.py"
      - "nonebot_plugin_aawarframe/subscriptions/service.py"
      - "nonebot_plugin_aawarframe/admin/control.py"
      - "nonebot_plugin_aawarframe/__init__.py"
      - "tests/test_qq_official.py"
      - ".github/workflows/qq-official-ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  qq-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official QQ adapter and plugin tests
        run: python -m pip install -e '.[dev,qq]'
      - name: Compile source
        run: python -m compileall -q nonebot_plugin_aawarframe
      - name: Lint modified adapter code
        run: python -m ruff check nonebot_plugin_aawarframe/protocols nonebot_plugin_aawarframe/commands/router.py nonebot_plugin_aawarframe/subscriptions/service.py nonebot_plugin_aawarframe/admin/control.py tests/test_qq_official.py
      - name: Official QQ adapter tests
        run: python -m pytest -q tests/test_qq_official.py tests/test_message_output.py
      - name: Full regression suite
        run: python -m pytest -q
