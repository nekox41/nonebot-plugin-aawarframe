name: Release — Core, QQ and OneBot Together

on:
  push:
    branches:
      - master
    paths:
      - 'core/pyproject.toml'
      - 'nonebot_plugin_aawfqq/pyproject.toml'
      - 'nonebot_plugin_aawfonebot/pyproject.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.23.1"
        required: true
      publish_pypi:
        description: "Publish all three distributions to PyPI (use for retries)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools and core
        run: |
          python -m pip install build
          python -m pip install -e './core[dev]' nonebot-adapter-qq nonebot-adapter-onebot
      - name: Check three synchronized versions against tag
        id: check-version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          packages = ["core", "nonebot_plugin_aawfqq", "nonebot_plugin_aawfonebot"]
          with (Path("core") / "pyproject.toml").open("rb") as inp:
              version = tomllib.load(inp)["project"]["version"]
          expected = (
              os.environ["MANUAL_VERSION"] if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
              else version if os.environ["GITHUB_REF_NAME"] == "master"
              else os.environ["GITHUB_REF_NAME"].removeprefix("v")
          )
          for name in packages:
              with (Path(name) / "pyproject.toml").open("rb") as inp:
                  project = tomllib.load(inp)["project"]
              assert project["version"] == expected, (
                  f"{name} is {project['version']} but release tag/version is {expected}"
              )
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"AAWF_VERSION={expected}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={expected}\n")
          PY
      - name: Fetch fresh data and validate generated archive
        run: python scripts/build_resources.py --build
      - name: Reinstall fresh generated Core and protocol packages as regular distributions
        run: |
          python -m pip uninstall -y nonebot-plugin-aawfcore
          python -m pip install './core[dev]'
          python -m pip install --no-deps ./nonebot_plugin_aawfqq ./nonebot_plugin_aawfonebot
      - name: Verify code and tests before publishing
        run: |
          python -m ruff check core/nonebot_plugin_aawfcore/api.py core/nonebot_plugin_aawfcore/client.py core/nonebot_plugin_aawfcore/infrastructure/riven_ocr.py nonebot_plugin_aawfqq/nonebot_plugin_aawfqq nonebot_plugin_aawfonebot/nonebot_plugin_aawfonebot scripts/build_resources.py scripts/package_release.py
          python -m pytest -q
      - name: Build and verify all three PyPI projects
        run: |
          python -m build --wheel --sdist core --outdir dist/core
          python -m build --wheel --sdist nonebot_plugin_aawfqq --outdir dist/qq
          python -m build --wheel --sdist nonebot_plugin_aawfonebot --outdir dist/onebot
          python -m pip install twine
          python -m twine check dist/*/*
      - name: Package three source/manual installation ZIPs
        run: python scripts/package_release.py --version "$AAWF_VERSION"
      - name: Create immutable version tag after successful validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$AAWF_VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Release tag $TAG already exists; keeping the existing immutable tag"
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi
      - name: Keep release artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: aawf-release-${{ github.run_number }}
          path: |
            dist/core/*
            dist/qq/*
            dist/onebot/*
            dist/manual/*
          retention-days: 30
          if-no-files-found: error

  publish-core:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nonebot-plugin-aawfcore
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aawf-release-${{ github.run_number }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core

  publish-qq:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-qq
      url: https://pypi.org/p/nonebot-plugin-aawfqq
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aawf-release-${{ github.run_number }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/qq

  publish-onebot:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-onebot
      url: https://pypi.org/p/nonebot-plugin-aawfonebot
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aawf-release-${{ github.run_number }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/onebot

  release-github:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aawf-release-${{ github.run_number }}
          path: dist
      - name: Create one GitHub Release with three platform distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG already exists; keeping its existing assets"
          else
            gh release create "$TAG" dist/core/* dist/qq/* dist/onebot/* dist/manual/* \
              --title "AAWarframe $TAG — Core + QQ + OneBot" \
              --generate-notes
          fi
