name: Publish PyPI (OIDC)
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: python -m pip install -e ".[dev,qq,onebot]"
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          ref = os.environ["RELEASE_REF"]
          if ref.startswith("refs/tags/v"):
              actual = ref.removeprefix("refs/tags/")
          elif ref.startswith("refs/heads/release/v"):
              actual = ref.removeprefix("refs/heads/release/")
          else:
              raise SystemExit(f"Ref is not a versioned release ref: {ref}")
          expected = "v" + version
          assert actual == expected, f"Release ref {actual} does not match project version {expected}"
          print(f"Validated release {version}")
          PY
      - name: Build resource snapshot once
        run: python scripts/build_resources.py --build
      - name: Validate
        run: |
          python -m compileall -q core scripts
          python -m pytest -q
      - name: Build one distribution
        run: |
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: aawarframe-dist
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: aawarframe
      url: https://pypi.org/p/nonebot-plugin-aawarframe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aawarframe-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
