name: Publish PyPI (OIDC)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: python -m pip install ".[dev,qq,onebot]"
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == "v" + version, "Tag does not match PyPI package version"
          PY
      - name: Build resource snapshot once
        run: python scripts/build_resources.py --build
      - name: Validate
        run: |
          python -m compileall -q core scripts
          python -m pytest -q
      - name: Build one distribution
        run: |
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: aawarframe-dist
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: aawarframe
      url: https://pypi.org/p/nonebot-plugin-aawarframe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aawarframe-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
