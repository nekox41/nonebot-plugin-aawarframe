name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,qq,onebot]"
      - name: Prepare verified offline resource snapshot
        run: python scripts/build_resources.py --build
      - run: python -m compileall -q nonebot_plugin_aawarframe scripts tests
      - run: python -m pytest -q
